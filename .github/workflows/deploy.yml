name: Deploy a DreamHost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # evita dos desplegaments alhora

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DH_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronitza amb rsync
        run: |
          rsync -avz --delete \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude '.DS_Store' \
            ./ ${{ secrets.DH_USER }}@${{ secrets.DH_HOST }}:~/elteudomini.com/
