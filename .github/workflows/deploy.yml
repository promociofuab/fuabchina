name: Deploy

# Branca dev  -> DreamHost (entorn de proves)
# Branca main -> Tencent   (producció)
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Entorn de proves (DreamHost)
  deploy-dreamhost:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ~/fuabchina.enricpineda.cat/
    steps:
      - uses: actions/checkout@v4

      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DH_HOST }} >> ~/.ssh/known_hosts

      - name: Sincronitza amb rsync
        run: |
          rsync -avz --delete \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude '.DS_Store' \
            ./ ${{ secrets.DH_USER }}@${{ secrets.DH_HOST }}:${{ env.DEPLOY_PATH }}

  # Servidor definitiu (VPS Ubuntu + Caddy)
  # La clau PROD_SSH_KEY està restringida al servidor amb rrsync:
  # només pot sincronitzar dins /srv/fuab-china/ (la ruta remota és relativa a aquesta arrel).
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_HOST: 120.53.125.120
      PROD_USER: ubuntu
      # Carpeta que es publica a producció.
      #   provisional/ -> només la pàgina provisional
      #   ./           -> tota la web (quan es vulgui fer el llançament)
      PROD_SOURCE: provisional/
      # Empremta fixada del servidor (no es fa ssh-keyscan per evitar suplantacions)
      # SHA256:dnmEGI99VD9Uow6SNeMoej0EEDclC6lcfXW6EvvDLQw
      PROD_HOST_KEY: "120.53.125.120 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIITUsyLF5GX9J+MS+yziRtgk2wuEh+R63XVwlUyxO/sE"
    steps:
      - uses: actions/checkout@v4

      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          echo "$PROD_HOST_KEY" > ~/.ssh/known_hosts

      - name: Sincronitza amb rsync
        run: |
          rsync -rlvz --delete --checksum \
            --chmod=D755,F644 \
            --exclude '.git*' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude '.DS_Store' \
            --exclude '/provisional/' \
            -e "ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "$PROD_SOURCE" "$PROD_USER@$PROD_HOST:./"

      - name: Comprova que la web respon
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://uabchina.cn/")
          echo "HTTP $code"
          test "$code" = "200"

      - name: Esborra la clau
        if: always()
        run: rm -f ~/.ssh/prod_key
